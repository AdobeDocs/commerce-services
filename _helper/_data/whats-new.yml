- description: The Product Metadata `visibleIn` field in the [ingestion schema](https://developer.adobe.com/commerce/services/reference/rest/#tag/ProductMetadata)
    now supports the `MISC` role. Use this role to keep an attribute available for
    backend and integration use, without making it visible on product detail pages
    or product listing pages.
